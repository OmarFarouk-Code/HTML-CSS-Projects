<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Stats preview card component</title>
    <link href="style.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <article class="insights-container">
        <h1 class="insights-heading">
          Get <span>insights</span> that help your business grow.
        </h1>

        <p class="insights-description">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>

        <section class="insights-metrics">
          <div class="metric-container">
            <h2 class="metric-value">10k+</h2>
            <p class="metric-type">companies</p>
          </div>
          <div class="metric-container">
            <h2 class="metric-value">314</h2>
            <p class="metric-type">templates</p>
          </div>
          <div class="metric-container">
            <h2 class="metric-value">12m+</h2>
            <p class="metric-type">queries</p>
          </div>
        </section>
      </article>

      <div class="insights-image-container">
        <img
          class="insights-image"
          src="images/image-header-desktop.jpg"
          alt="picture of people working"
        />
      </div>
    </div>
  </body>
</html>
