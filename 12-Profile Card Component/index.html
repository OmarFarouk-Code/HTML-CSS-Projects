<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Component</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="lights-control">
      Lights
      <input type="checkbox" id="lights" class="lights-input" />
      <label for="lights" class="lights-label"></label>
    </div>
    <div class="container">
      <div class="top"></div>
      <div class="middle">
        <img
          class="middle__avatar"
          src="assets/profile-pic.jpg"
          alt="picture of mohamed absrea"
        />
        <h1 class="middle__name">Mohamed Abusrea</h1>
        <p class="middle__role">Software Engineer</p>
      </div>
      <div class="bottom">
        <div class="column">
          <div class="icons">
            <a class="link" href="#">
              <img class="icon" src="assets/linkedin.png" alt="linkedin" />
            </a>
            <a class="link" href="#">
              <img class="icon" src="assets/youtube.png" alt="youtube" />
            </a>
          </div>
          <h3 class="username">mohamedabusrea</h3>
        </div>

        <div class="column">
          <div class="icons">
            <a class="link" href="#">
              <img class="icon" src="assets/twitter.png" alt="twitter" />
            </a>
            <a class="link" href="#">
              <img class="icon" src="assets/instagram.png" alt="instagram" />
            </a>
          </div>
          <h3 class="username">mohamed_abusrea</h3>
        </div>

        <div class="column">
          <div class="icons">
            <a class="link" href="#">
              <img class="icon" src="assets/facebook.png" alt="facebook" />
            </a>
          </div>
          <h3 class="username">m.abusre3</h3>
        </div>
      </div>
    </div>
  </body>
</html>
